services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xepelin_growth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xepelin_growth"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - xepelin_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xepelin_postgres:
